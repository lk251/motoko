name: adaptive-recall-bootstrap

on:
  push:
    branches:
      - feature/adaptive-episodic-recall

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/adaptive-episodic-recall
          fetch-depth: 0

      - name: Apply adaptive recall integration
        run: python3 scripts/apply_adaptive_recall_patch.py

      - name: Quick syntax and focused tests
        run: |
          python3 -m py_compile motoko motoko_core/episodic_recall.py motoko_core/conversations.py motoko_core/state.py motoko_core/sources.py
          PYTHONPATH=. python3 tests/episodic_recall_test.py

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run full repository checks
        run: nix flake check

      - name: Commit validated implementation
        run: |
          git config user.name "motoko-adaptive-recall-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/apply_adaptive_recall_patch.py .github/workflows/adaptive-recall-bootstrap.yml
          git add -A
          git commit -m "Implement adaptive episodic recall"
          git push origin HEAD:feature/adaptive-episodic-recall
